<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="images/gmu.png" />
    <title>Contact</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="skills.html">Skills</a>
      <a href="contact.html">Contact</a>
    </nav>
    <h1>Contact Information</h1>
    <form>
      <div id="flex-container">
        <div>
          <label for="name">Name:</label>
          <input type="text" name="name" id="name" placeholder="First Last" />
          <br />
          <br />
          <label for="email">Email:</label>
          <input type="email" name="email" id="email" placeholder="Email" />
          <br />
          <br />
          <label for="message">Nature of your message:</label>
          <br />
          <input type="radio" name="message_type" id="comment" />
          <label for="message_type">Comment</label>
          <input type="radio" name="message_type" id="question" />
          <label for="message_type">Question</label>
          <br />
          <br />
          <label for="bigbox">Message:</label>
          <br />
          <textarea
            name="bigbox"
            id="bigbox"
            rows="8"
            cols="30"
            placeholder="Enter your message here"
          ></textarea>
          <br />
          <input type="submit" onclick="handleSubmit(event)" />
          <br />
          <p id="confirmation-message"></p>

          <script>
            function handleSubmit(event) {
              event.preventDefault();

              const name = document.getElementById("name");
              const email = document.getElementById("email");
              const message = document.getElementById("bigbox");
              const confirmation = document.getElementById(
                "confirmation-message"
              );
              confirmation.textContent = "Your message has been sent";

              setTimeout(() => {
                name.value = "";
                email.value = "";
                message.value = "";

                const radios = document.getElementsByName("message_type");

                radios.forEach((r) => (r.checked = false));
                confirmation.textContent = "";
              }, 3000);
            }
          </script>
        </div>
      </div>
    </form>
  </body>
</html>
